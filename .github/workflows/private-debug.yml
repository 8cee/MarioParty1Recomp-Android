name: Private Mario Party Android debug

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tools/ci/build-private-self.sh'
      - '.github/workflows/private-debug.yml'
      - 'app/**'
      - 'recomp/**'
      - 'tools/android/**'
      - 'tools/build-mp1-recomp.sh'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

permissions:
  contents: read
  actions: read

concurrency:
  group: mp1-private-self-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout private MP1 source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Restore verified generated MP1 sources
        uses: actions/download-artifact@v4
        with:
          name: MarioParty1Recomp-generated-sources
          repository: 8cee/MarioParty1Recomp-Android
          run-id: 37073499032
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .generated-cache

      - name: Install generated MP1 sources
        shell: bash
        run: |
          test -s .generated-cache/MarioParty1Recomp-generated-sources.tar.gz
          tar -xzf .generated-cache/MarioParty1Recomp-generated-sources.tar.gz
          test -n "$(find recomp/generated -name 'funcs_*.c' -print -quit)"
          test -s recomp/rsp/aspMain.cpp

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build private Mario Party APK
        shell: bash
        run: bash tools/ci/build-private-self.sh

      - name: Upload generated MP1 sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MarioParty1Recomp-generated-sources
          path: MarioParty1Recomp-generated-sources.tar.gz
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MarioParty1Recomp-private-debug
          path: MarioParty1Recomp-private-debug.apk
          if-no-files-found: warn
          retention-days: 30
