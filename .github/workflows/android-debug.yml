name: Android Debug APK
on:
  # Public checkout intentionally omits generated MP1 sources. Run this only
  # manually when those sources have been supplied; normal release validation
  # is handled by private-debug.yml, which restores the verified source cache.
  workflow_dispatch:
concurrency:
  group: mp1-android-debug
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK and NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify generated game code
        run: |
          test -n "$(find recomp/generated -name 'funcs_*.c' -print -quit)" || { echo 'Generated MP1 code is intentionally not stored in the public repo.'; exit 1; }
          test -s recomp/rsp/aspMain.cpp
      - name: Build debug APK
        run: bash tools/android/build_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MarioParty1Recomp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
