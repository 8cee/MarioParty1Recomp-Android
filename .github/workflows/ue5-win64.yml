name: Mario Party UE5 Win64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ue5/**'
      - '.github/workflows/ue5-win64.yml'

jobs:
  package-win64:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Locate Unreal Engine
        shell: powershell
        run: |
          $candidates = @(
            $env:UE_ROOT,
            "C:\Program Files\Epic Games\UE_5.6",
            "C:\Program Files\Epic Games\UE_5.5",
            "C:\Program Files\Epic Games\UE_5.4",
            "D:\UnrealEngine",
            "D:\UE5"
          ) | Where-Object { $_ -and $_.Length -gt 0 }
          $root = $null
          foreach ($candidate in $candidates) {
            if (Test-Path (Join-Path $candidate "Engine\Build\BatchFiles\RunUAT.bat")) {
              $root = $candidate
              break
            }
          }
          if (-not $root) {
            Write-Host "UE5 is not installed on this GitHub-hosted runner."
            Get-ChildItem "C:\Program Files" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            throw "No Unreal Engine installation available for packaging."
          }
          $uat = Join-Path $root "Engine\Build\BatchFiles\RunUAT.bat"
          echo "UE_ROOT=$root" >> $env:GITHUB_ENV
          echo "UAT=$uat" >> $env:GITHUB_ENV

      - name: Package Win64
        shell: powershell
        run: |
          & "$env:UAT" BuildCookRun -project="$env:GITHUB_WORKSPACE\ue5\MarioParty1UE5.uproject" -noP4 -build -cook -stage -pak -archive -archivedirectory="$env:GITHUB_WORKSPACE\dist" -platform=Win64 -clientconfig=Development -utf8output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify executable
        shell: powershell
        run: |
          $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\dist" -Recurse -Filter "MarioParty1UE5.exe" | Select-Object -First 1
          if (-not $exe) { throw "MarioParty1UE5.exe was not produced." }
          Write-Host "UE5 executable: $($exe.FullName)"

      - name: Upload Win64 package
        uses: actions/upload-artifact@v4
        with:
          name: MarioParty1UE5-Win64
          path: dist/**
          if-no-files-found: error
          retention-days: 30
