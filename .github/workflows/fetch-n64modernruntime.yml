name: Fetch N64ModernRuntime source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-n64modernruntime.yml"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Clone runtime
        run: |
          git clone --recurse-submodules https://github.com/N64Recomp/N64ModernRuntime.git runtime
          rm -rf runtime/.git

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: n64modernruntime-source
          path: runtime
          if-no-files-found: error
          retention-days: 1
